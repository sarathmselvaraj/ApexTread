<!DOCTYPE html>

<html data-theme="light" dir="ltr" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Create Account | ApexTread</title><meta content="Create an ApexTread account to manage bookings, saved services and service history." name="description"/><meta content="Create Account | ApexTread" property="og:title"/><meta content="Create an ApexTread account to manage bookings, saved services and service history." property="og:description"/><meta content="website" property="og:type"/><meta content="summary_large_image" name="twitter:card"/><link href="assets/img/favicon.png" rel="icon" sizes="32x32" type="image/png"/><link href="assets/img/favicon.ico" rel="shortcut icon" type="image/x-icon"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="assets/css/tailwind-local.css" rel="stylesheet"/><link href="assets/css/style.css" rel="stylesheet"/></head><body class="apex-reference-layout auth-premium-page auth-register-page" data-page="auth" data-page-name="register">
<div aria-label="Display controls" class="auth-floating-controls">
<button aria-label="Toggle light and dark mode" class="auth-float-btn" data-toggle-theme="" title="Toggle theme" type="button">
<span aria-hidden="true" class="auth-control-icon auth-theme-icon apex-action-icon"></span><span class="auth-control-text apex-action-label">Dark</span>
</button>
<button aria-label="Toggle text direction" class="auth-float-btn" data-toggle-dir="" title="Toggle direction" type="button">
<span aria-hidden="true" class="auth-control-icon apex-action-icon"></span><span class="auth-control-text apex-action-label">RTL</span>
</button>
</div>
<main class="auth-premium-main">
<section aria-labelledby="register-title" class="auth-premium-stage auth-register-stage">
<div aria-hidden="true" class="auth-pattern"></div>
<form class="auth-card auth-card-register" id="register-form" novalidate="">
<a aria-label="ApexTread home" class="auth-brand-mark" href="index.html">
<span class="auth-brand-icon"><img alt="" aria-hidden="true" src="assets/img/apextread-logo.png"/></span>
<span class="auth-brand-word">Apex<span>Tread</span></span>
</a>
<div class="auth-card-heading">
<h1 id="register-title">Create Account</h1>
<p>Create your ApexTread account to manage bookings, saved services and service history.</p>
</div>
<div class="auth-field">
<label for="register-name">Full Name</label>
<div class="auth-input-wrap"><span aria-hidden="true" class="auth-input-icon">◎</span><input autocomplete="name" class="form-input" id="register-name" name="fullName" placeholder="Your full name" required=""/></div>
</div>
<div class="auth-field">
<label for="register-email">Email Address</label>
<div class="auth-input-wrap"><span aria-hidden="true" class="auth-input-icon">✉</span><input autocomplete="email" class="form-input" id="register-email" name="email" placeholder="you@example.com" required="" type="email"/></div>
</div>
<div class="auth-field">
<label for="register-phone">Phone Number</label>
<div class="auth-input-wrap"><span aria-hidden="true" class="auth-input-icon">☎</span><input autocomplete="tel" class="form-input" id="register-phone" name="phone" pattern="[0-9+() -]{7,20}" placeholder="Your phone number" required="" type="tel"/></div>
</div>
<div class="auth-field">
<label for="register-password">Password</label>
<div class="auth-input-wrap"><span aria-hidden="true" class="auth-input-icon">⌑</span><input autocomplete="new-password" class="form-input" id="register-password" minlength="8" name="password" placeholder="Create a password" required="" type="password"/><button aria-label="Show password" aria-pressed="false" class="auth-password-toggle" data-password-toggle="register-password" type="button">⌾</button></div>
</div>
<div class="auth-field">
<label for="register-confirm">Confirm Password</label>
<div class="auth-input-wrap"><span aria-hidden="true" class="auth-input-icon">✓</span><input autocomplete="new-password" class="form-input" id="register-confirm" minlength="8" name="confirmPassword" placeholder="Confirm your password" required="" type="password"/><button aria-label="Show password" aria-pressed="false" class="auth-password-toggle" data-password-toggle="register-confirm" type="button">⌾</button></div>
</div>
<label class="auth-terms"><input name="terms" required="" type="checkbox"/><span>I agree to the <a aria-label="Terms and Conditions" href="#">Terms &amp; Conditions</a> and <a aria-label="Privacy Policy" href="#">Privacy Policy</a>.</span></label>
<button class="auth-primary-btn" type="submit"><span aria-hidden="true">＋</span> Create Account</button>
<div aria-live="polite" class="auth-status" id="auth-status" role="status"></div>
<p class="auth-switch-copy">Already have an account? <a href="login.html">Sign In</a></p>
</form>
</section>
</main>
<script src="assets/js/main.js"></script>
</body></html>
